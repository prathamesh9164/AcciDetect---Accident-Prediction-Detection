pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Custom temp paths for non-root running on Hugging Face
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/nginx_access.log;
    error_log /tmp/nginx_error.log;

    server {
        # Hugging Face Spaces routes traffic to port 7860
        listen 7860;
        server_name localhost;

        # 1. Serve React Frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxy API requests to Django Backend (Daphne on 8000)
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Proxy WebSocket requests to Django Channels (Daphne on 8000)
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # 4. Serve Media files directly (videos, clips, csv outputs)
        location /media/ {
            alias /app/backend/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
